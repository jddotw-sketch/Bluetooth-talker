name: Build Windows 11 BlueVoice

on:
  push:
    branches: [main, master, "feature/**"]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and compile
        run: dotnet build windows/BlueVoice.Windows/BlueVoice.Windows.csproj --configuration Release
      - name: Publish standalone Windows 11 app
        run: dotnet publish windows/BlueVoice.Windows/BlueVoice.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output windows-dist
      - name: Upload Windows 11 application
        uses: actions/upload-artifact@v4
        with:
          name: BlueVoice-Windows11-x64
          path: windows-dist/**
          if-no-files-found: error
          retention-days: 30
